version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: ged_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ged_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ged_password}
      POSTGRES_DB: ${DB_NAME:-ged_systa}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ged_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ged_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: ged_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:
