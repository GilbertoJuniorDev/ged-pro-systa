version: '3.9'

services:
  db:
    image: postgres:17-alpine
    container_name: ged-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ged_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ged_password}
      POSTGRES_DB: ${DB_NAME:-ged_systa}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ged-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ged_user} -d ${DB_NAME:-ged_systa}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ged-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - ged-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: ged-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://${DB_USER:-ged_user}:${DB_PASSWORD:-ged_password}@db:5432/${DB_NAME:-ged_systa}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./uploads}
    ports:
      - '3333:3333'
    networks:
      - ged-network

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    container_name: ged-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3333
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - '3000:3000'
    networks:
      - ged-network

  adminer:
    image: adminer:latest
    container_name: ged-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - db
    profiles:
      - dev
    networks:
      - ged-network

volumes:
  postgres_data:
  redis_data:

networks:
  ged-network:
    driver: bridge
