services:
  db:
    image: postgres:17-alpine
    container_name: ged-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ged_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ged_password}
      POSTGRES_DB: ${DB_NAME:-ged_systa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ged-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-ged_user} -d ${DB_NAME:-ged_systa}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ged-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ged-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: ged-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - ged-network
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: ged-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SEED_ADMIN: ${SEED_ADMIN:-false}
      PORT: 3333
      DATABASE_URL: postgresql://${DB_USER:-ged_user}:${DB_PASSWORD:-ged_password}@db:5432/${DB_NAME:-ged_systa}?sslmode=disable
      REDIS_URL: redis://redis:6379
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/ged_logs}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-./uploads}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@ged.local}
      # APP_URL = URL pública do FRONTEND (ex: https://gedpro.systa.com.br)
      # Usado pelo CORS da API — deve bater exatamente com a origin enviada pelo browser
      APP_URL: ${APP_URL}
    ports:
      - '3333:3333'
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ged-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3333/system/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: ged-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      API_INTERNAL_URL: http://api:3333
    ports:
      - '3000:3000'
    networks:
      - ged-network

  adminer:
    image: adminer:latest
    container_name: ged-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - db
    profiles:
      - dev
    networks:
      - ged-network

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  uploads_data:

networks:
  ged-network:
    driver: bridge
