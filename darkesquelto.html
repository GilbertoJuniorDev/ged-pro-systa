<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema GED - Layout Base (Dark)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <aside id="sidebar" class="bg-slate-900 w-64 border-r border-slate-700 flex flex-col transition-transform duration-300 absolute z-30 h-full md:relative md:translate-x-0 -translate-x-full">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-700">
            <span class="text-xl font-bold text-indigo-400 tracking-tight">GED Systa</span>
            
            <button id="closeSidebarMobile" class="md:hidden text-slate-500 hover:text-slate-300 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="#" class="flex items-center px-3 py-2.5 bg-indigo-900/40 text-indigo-400 rounded-lg group font-medium transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Dashboard
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-slate-100 rounded-lg group font-medium transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-600 group-hover:text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Documentos
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-slate-400 hover:bg-slate-800 hover:text-slate-100 rounded-lg group font-medium transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-600 group-hover:text-slate-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                Categorias
            </a>
        </nav>
    </aside>

    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-20 hidden md:hidden transition-opacity"></div>

    <div class="flex-1 flex flex-col min-w-0 h-screen">
        
        <header class="h-16 bg-slate-900 border-b border-slate-700 flex items-center justify-between px-4 sm:px-6 z-10 shrink-0">
            <div class="flex items-center">
                <button id="openSidebar" class="md:hidden mr-4 text-slate-500 hover:text-slate-300 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <h1 class="text-xl font-semibold text-slate-100">Módulo Atual</h1>
            </div>

            <div class="flex items-center space-x-4">
                <button class="text-slate-500 hover:text-indigo-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <div class="w-8 h-8 rounded-full bg-indigo-900 flex items-center justify-center text-indigo-300 font-bold border border-indigo-700 cursor-pointer">
                    G
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 bg-slate-950 relative">

            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-slate-100">Visão Geral</h2>

                <div class="relative">
                    <button id="toggleFilters" class="flex items-center px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg shadow-sm text-sm font-medium text-slate-300 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
                        <svg class="w-4 h-4 mr-2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        Filtros
                    </button>

                    <div id="filterDropdown" class="hidden absolute right-0 mt-2 w-64 bg-slate-900 border border-slate-700 rounded-xl shadow-lg z-10 p-4 transform origin-top-right transition-all">
                        <h3 class="text-xs uppercase tracking-wider font-bold text-slate-500 mb-3">Filtrar Status</h3>
                        <div class="space-y-3">
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" class="rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 w-4 h-4 transition-colors bg-slate-800">
                                <span class="ml-3 text-sm text-slate-300 font-medium">Documentos Ativos</span>
                            </label>
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" class="rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 w-4 h-4 transition-colors bg-slate-800">
                                <span class="ml-3 text-sm text-slate-300 font-medium">Arquivados</span>
                            </label>
                        </div>
                        <div class="mt-4 pt-4 border-t border-slate-700 flex justify-end">
                            <button class="text-sm px-3 py-1.5 bg-indigo-900/40 text-indigo-400 rounded-md font-medium hover:bg-indigo-900/60 transition-colors">Aplicar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-700 shadow-sm flex flex-col justify-between">
                    <div class="h-4 bg-slate-800 rounded-md w-1/2 mb-4"></div>
                    <div class="h-8 bg-slate-700 rounded-md w-1/4"></div>
                </div>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-700 shadow-sm flex flex-col justify-between">
                    <div class="h-4 bg-slate-800 rounded-md w-1/2 mb-4"></div>
                    <div class="h-8 bg-slate-700 rounded-md w-1/4"></div>
                </div>
            </div>

            <div class="bg-slate-900 rounded-xl border border-slate-700 shadow-sm overflow-hidden">
                 <div class="p-6 border-b border-slate-800 bg-slate-800/50">
                     <div class="h-4 bg-slate-700 rounded-md w-48"></div>
                 </div>
                 <div class="p-6 divide-y divide-slate-800">
                     <div class="py-3 flex items-center justify-between"><div class="h-4 bg-slate-800 rounded-md w-1/3"></div><div class="h-4 bg-slate-800 rounded-md w-16"></div></div>
                     <div class="py-3 flex items-center justify-between"><div class="h-4 bg-slate-800 rounded-md w-1/2"></div><div class="h-4 bg-slate-800 rounded-md w-16"></div></div>
                     <div class="py-3 flex items-center justify-between"><div class="h-4 bg-slate-800 rounded-md w-1/4"></div><div class="h-4 bg-slate-800 rounded-md w-16"></div></div>
                 </div>
            </div>

        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const openSidebarBtn = document.getElementById('openSidebar');
            const closeSidebarBtn = document.getElementById('closeSidebarMobile');
            const sidebarOverlay = document.getElementById('sidebarOverlay');

            function toggleSidebar() {
                sidebar.classList.toggle('-translate-x-full');
                sidebarOverlay.classList.toggle('hidden');
            }

            openSidebarBtn.addEventListener('click', toggleSidebar);
            closeSidebarBtn.addEventListener('click', toggleSidebar);
            sidebarOverlay.addEventListener('click', toggleSidebar);

            const toggleFiltersBtn = document.getElementById('toggleFilters');
            const filterDropdown = document.getElementById('filterDropdown');

            toggleFiltersBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!filterDropdown.contains(e.target) && !toggleFiltersBtn.contains(e.target)) {
                    filterDropdown.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
